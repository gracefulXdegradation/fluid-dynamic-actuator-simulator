services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fds_user
      POSTGRES_PASSWORD: fds_password
      POSTGRES_DB: fds_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fds_user -d fds_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  simulator:
    build:
      context: ./.devcontainer/simulator
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:cached
    environment:
      DATABASE_URL: postgresql://fds_user:fds_password@postgres:5432/fds_db
      REDIS_URL: redis://redis:6379
    command: /usr/local/bin/start-simulator.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    links:
      - web-app

  web-app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - .:/workspace:cached
    working_dir: /workspace/web-app
    environment:
      DATABASE_URL: postgresql://fds_user:fds_password@postgres:5432/fds_db
      REDIS_URL: redis://redis:6379
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
